[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-api"
version = "0.1.0"
description = "住在終端機裡的貓 — Python 核心（營養模型、紀錄、HTTP API）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.24",
    "numba>=0.59",
    "pyte>=0.8.2",
    "wcwidth>=0.2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
neko = "neko_terminal.cli:main"
neko-api = "neko_api.server:main"
neko-core = "neko_api.cli:main"

[tool.setuptools]
packages = ["neko_api", "neko_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette 的 TestClient 提醒 httpx 要換套件：是第三方的事，不影響測試
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
